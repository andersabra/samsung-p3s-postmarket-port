# Stop udev/mdev from auto-loading these by device alias.
# Samsung display stack: the p3s-display service loads it in the order it needs
# (dpu must probe after mcd_panel_s6e3had). snd_soc_dp_dma (DisplayPort audio) and
# tuihw (trusted UI) depend on dpu and would pull it in too early.
blacklist dpu
blacklist snd_soc_dp_dma
blacklist tuihw
# Panel data for other Samsung models (this phone's panel is s6e3had)
blacklist mcd_panel_s6e3fab
blacklist mcd_panel_s6e3fc3
blacklist mcd_panel_s6e3hab
# Hardware/software watchdogs: nothing in postmarketOS feeds them, so they would reboot the phone
blacklist s3c2410_wdt
blacklist softdog
blacklist sec_debug_softdog
blacklist sec_debug_wdd_info
# Test modules that deliberately trigger crashes/hangs
blacklist sec_debug_test
blacklist exynos_debug_test
# Video codec: needs mfc_fw.bin from the vendor partition; without it each open waits 60 s on the firmware fallback
blacklist exynos_mfc

# Any explicit "modprobe dpu" still gets the panel data and its power supplies first
softdep dpu pre: s2mpb02_regulator s2dos05_regulator mcd_panel_s6e3had
# Wi-Fi: this phone has a BCM4389 (dhd_bcm4389); the BCM4375 driver from the stock module list only refuses to load
blacklist dhd_bcm4375
